<div class="flex h-screen bg-gray-50 overflow-hidden">
  <!-- Sidebar - only show if authenticated -->
  <app-sidebar
    *ngIf="isAuthenticated"
    [isAdmin]="isAdmin"
    (navigateHome)="navigateToHome()"
    (navigatePdfEditor)="navigateToPdfEditor()"
    (navigateAdmin)="navigateToAdmin()"
    (navigateRecent)="loadRecentFiles()"
    (navigateDownloads)="loadDownloads()"
    (navigateRecycleBin)="loadRecycleBin()"
    (navigateSharedWithMe)="navigateToSharedWithMe()"
  >
  </app-sidebar>

  <div class="flex-1 flex flex-col overflow-hidden relative">
    <!-- Header - only show if authenticated -->
    <header
      *ngIf="isAuthenticated"
      class="bg-white border-b border-gray-200 px-4 py-2.5 flex items-center shadow-sm z-30"
    >
      <div class="flex items-center" *ngIf="showSearch">
        <!-- Search Input -->
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <svg
              class="h-4 w-4 text-gray-400"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
          </div>
          <input
            type="text"
            class="block w-64 pl-10 pr-3 py-1.5 border border-gray-200 rounded-xl leading-5 bg-gray-50 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 sm:text-sm transition-all duration-200"
            placeholder="Rechercher..."
            [value]="searchQuery"
            (input)="onSearch($event)"
            (keydown.enter)="onSearchEnter()"
          />
          <div
            *ngIf="searchQuery"
            class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer"
            (click)="clearSearch()"
          >
            <svg
              class="h-4 w-4 text-gray-400 hover:text-gray-600"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              ></path>
            </svg>
          </div>
        </div>
      </div>

      <div class="flex items-center space-x-4 ml-auto">
        <!-- Notification Bell Icon -->
        <button
          *ngIf="isAuthenticated"
          (click)="navigateToSharedWithMe()"
          class="relative p-2 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-lg transition-all"
          title="Fichiers partagés"
        >
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"
            ></path>
          </svg>
          <!-- Badge -->
          <div *ngIf="hasNewSharedItems" class="absolute top-1.5 right-1.5 flex h-2.5 w-2.5">
            <span
              class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"
            ></span>
            <span
              class="relative inline-flex rounded-full h-2.5 w-2.5 bg-red-500 border border-white"
            ></span>
          </div>
        </button>

        <!-- User Profile & Logout -->
        <div class="flex items-center pl-4 border-l border-gray-100 space-x-4">
          <div
            class="flex items-center space-x-3 cursor-pointer hover:opacity-80 transition-opacity"
            (click)="navigateToProfile()"
            title="Mon profil"
          >
            <div class="text-right hidden sm:block relative">
              <div class="flex items-center justify-end space-x-1">
                <p class="text-xs font-bold text-gray-800">{{ username }}</p>
              </div>
              <p class="text-[10px] text-gray-400 font-medium">
                {{ isAdmin ? 'Administrateur' : 'Utilisateur' }}
              </p>
            </div>
            <div
              class="w-9 h-9 bg-gray-100 rounded-full flex items-center justify-center text-sm font-bold text-gray-600 border border-gray-200"
            >
              {{ username?.charAt(0)?.toUpperCase() }}
            </div>
          </div>

          <button
            class="p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all"
            title="Déconnexion"
            (click)="logout()"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main
      class="flex-1 overflow-hidden relative"
      [class.bg-white]="!isAuthenticated"
      [class.bg-gray-50]="isAuthenticated"
    >
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
